# The file check: what a client asks for on the file-server address, and what to answer.
#
# A value file, not code. The bytes change when the client's own files change, so they belong here
# where they can be read and replaced by a measurement rather than rebuilt.
#
# `request` is the 21 bytes a client sends before anything else on that socket. It compares the whole
# string, so a byte more or less is a different question.
#
# `answer` is the 32 bytes to reply with: header 0x02F1, length 0x0020, then six Gw.dat file ids in
# tight consecutive order with a zero among them - the order is what a capture shows, not a rule.
#
# Where these came from, and what would replace them:
# docs/port/02-wire.md. The ids are a client-build fact: a new client build brings a new set, and the
# set is refreshed by capturing the reply a live client accepts, never by arithmetic on these numbers.

request = 01 00 00 00 00 F1 00 10 00 01 00 00 00 00 00 00 00 00 00 00 00
answer  = F1 02 20 00 AB F7 05 00 B4 F7 05 00 9C 43 05 00 B6 F7 05 00 B7 F7 05 00 00 00 00 00 B5 F7 05 00
