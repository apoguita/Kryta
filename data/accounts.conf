# Who the portal says an account is: `login_name = user_id ; token`.
#
# This is this project's own and it is temporary. A real identity store is a schema decision and the
# login database has no account table yet; until it does, a client can log in as any name listed here,
# and the pair on the right is what its login message will carry.
#
# A name not listed answers the reference's own refusal: 400 who are you?
#
# user1@example.com is the name the client in this machine's rig types, which is why it is first:
# a client asked to log in as it, with the password 123, and the server refused because the name was
# not here.

user1@example.com = 0F5A2C1E-1111-2222-3333-444455556666 ; AAAAAAAA-0000-1111-2222-333344445555
player@example.com = 0F5A2C1E-1111-2222-3333-444455556666 ; AAAAAAAA-0000-1111-2222-333344445555