# Kryta: AzerothCore's server, in Rust, serving Guild Wars (Tyria).
#
# The members are the reference's libraries and programs, flattened out of AzerothCore's
# `src/` into the top level. The dependency order is the reference's own, read from its
# CMakeLists files at 30a36ec4d:
#
#   common <- database <- shared <- game <- scripts
#
#   authserver links shared;  worldserver links shared, game and scripts.
#
# Here authserver links game as well (docs/decisions/0010-auth-and-the-game-library.md).
#
# `modules/*` joins this list when the first mod-* crate exists. An empty glob is a cargo
# error, so the line arrives with the module rather than before it.

[workspace]
resolver = "3"
members = [
  "common",
  "database",
  "shared",
  "game",
  "scripts",
  "authserver",
  "worldserver",
  # The administration tool: an operator's page, not a server. It links the same libraries the two
  # programs do, so what it writes is what they read.
  "tools/manage",
  "tools/management-service",
  # The stack's own command: one process that starts the services this machine runs and stops them
  # together. It starts nothing a person did not list in `stack.json` (`tools/supervisor`).
  "tools/supervisor",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"
publish = false

# One lint policy, opted into per crate with `[lints] workspace = true`.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
