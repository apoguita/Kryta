[package]
name = "authserver"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "authserver"
path = "src/main.rs"

# Reference: `target_link_libraries(authserver PUBLIC shared)`. `shared` links `database`,
# which links `common`, so one dependency here is the reference's whole auth chain. `common` is
# also named directly because the reference's include chain is public.
[dependencies]
shared = { path = "../shared" }
database = { path = "../database" }
# A query's rows are read as postgres::Row, which is the type the pool answers with.
postgres = "0.19"
common = { path = "../common" }
# The portal lives in the game library (game/src/Portal/), and this program serves it -
# docs/decisions/0003-portal-host.md.
game = { path = "../game" }
# The reference's signal handler, which is what its io loop returns on.
ctrlc = "3"
# The key exchange raises a 512-bit number to a 511-bit exponent modulo a 512-bit prime.
num-bigint = "0.4"
# The master secret is 20 bytes from the operating system's entropy.
getrandom = "0.2"
# The client link (docs/port/22-client-platform.md): its messages, shared with the DLL, and the DLL's
# own reader of offset documents, which checks the files this program serves when it starts.
kryta-client-link = { path = "../tools/client-link" }
kryta-client = { path = "../tools/client-dll" }
serde_json = "1"
