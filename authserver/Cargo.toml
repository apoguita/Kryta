[package]
name = "authserver"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "authserver"
path = "src/main.rs"

# Reference: `target_link_libraries(authserver PUBLIC shared)`. `shared` links `database`,
# which links `common`, so one dependency here is the reference's whole auth chain. `common` is
# also named directly because the reference's include chain is public.
[dependencies]
shared = { path = "../shared" }
database = { path = "../database" }
common = { path = "../common" }
# The portal lives in the game library (game/src/Portal/), and this program serves it -
# docs/decisions/0003-portal-host.md.
game = { path = "../game" }
# The reference's signal handler, which is what its io loop returns on.
ctrlc = "3"
# The key exchange raises a 512-bit number to a 511-bit exponent modulo a 512-bit prime.
num-bigint = "0.4"
# The master secret is 20 bytes from the operating system's entropy.
getrandom = "0.2"
